<div id="letter" class="letter" role="tabpanel" aria-labelledby="tab-source"><p class="loading">Loading…</p></div><noscript><section class="plain-letter"><p lang="fr">Si je n’ai écrit à Sa Sainteté et à Votre Seigneurie Illustrissime aussi souvent que le devoir me le commande, deux choses m’y ont empêché. La</p><p lang="fr">première qu’il est malaisé de le faire à la vérité sans que quelqu’un d’eux y trouve intérêt, et l’autre que les affaires sont maniées par</p><p lang="fr">tant de mains et de passions si différentes, on est en incertitude si grande qu’il semble de nécessité que nous périssions, et l’appréhension</p><p lang="fr">de notre perte ne pourrait qu’elle ne causât à Sa Sainteté un extrême déplaisir, et je me garderai le plus qu’il me sera possible</p><p lang="fr">d’être ministre de mauvaise nouvelle, tellement que je m’étais résolu de ne lui plus écrire ni à Votre Seigneurie Illustrissime, si par la sienne</p><p lang="fr">du premier de juin elle ne m’eût assuré que Sa Sainteté avait eu pour agréable le compte que je lui ai osé bien particulièrement rendre</p><p lang="fr">des occurrences de deçà et de lui en dire librement ce qu’il m’en semblait, et encore qu’il se soit passé plusieurs nouveautés depuis mes</p><p lang="fr">lettres, si trouvera elle qu’en effet je ne me suis point trompé, et que pour n’y avoir pas voulu remédier à temps soit lors que j’étais</p><p lang="fr">par-delà ou depuis. Enfin, si Dieu n’y met la main, je vois l’affaire de la religion catholique en ce royaume en mauvais train</p><p lang="fr">pour plusieurs raisons que je pourrais dire à Votre Seigneurie Illustrissime, outre ce que j’en fai[s] entendre à Sa Sainteté sur ce sujet. Joint qu’il semble</p><p lang="fr">que ce soit autant d’oracles tout ce qui lui est dit par ceux qui ont tenu ledit ministère deçà pour le Saint-Siège, pour ne rien donner à la</p><p lang="fr">vérité qui sera maintenant trouvée telle que je l’ai toujours dite aux dépens de ma tête, commençant à Monsieur Mateouci</p><p lang="fr">jusqu’à ce qui en est, et que eux seuls ont plus apporté de ruine aux affaires que les ennemis, tant ils</p><p lang="fr">ont été remplis de je ne sais quelle chose qui ne nous est point propre, ou de peu de pratique de nos hume[urs] et la passion.</p><p lang="fr">Et si j’ai rien mis en avant au discours que je donne à Sa Sainteté sur les déportements dudit Mateuci,</p><p lang="fr">la moindre lettre que l’on me saurait écrire me fera toujours paraître en tous lieux que l’on voudra pour lui maintenir. De Monsieur de</p><p lang="fr">Malvoisie, je n’y étais lors qu’ils sont entrés en mauvais ménage, Mayenne et lui. Toutefois</p><p lang="fr">le neveu de Monsieur le légat m’en a fait ses plaintes, aussi qu’il est malaisé de contredire à un bruit général, et de soi-mê-</p><p lang="fr">me elle peut considérer que l’armée du roi d’Espagne n’a rien fait sinon de demeurer sur la frontière,</p><p lang="fr">servant d’opprobre à un si grand monarque, et qui s’est retirée seulement sur un bruit que Navarre</p><p lang="fr">l’allait chercher. Et outre, Monsieur le légat, sans considération quelconque, veut que nous en venio-</p><p lang="fr">ns à l’élection d’un roi, lors que l’ennemi commence à gagner les voix de beaucoup qui lui ét-</p><p lang="fr">aient ennemis par l’apparence qu’il fait de se vouloir faire catholique, et doit dimanc-</p><p lang="fr">he aller à la messe. N’avoir rien pour lui résister sinon des promesses où l’on a tant</p><p lang="fr">été trompé, il faudrait beaucoup d’effets avant que de nous faire rejeter l’ap-</p><p lang="fr">parence d’une paix, et ne sera peu fait si nous la modérons par une trêve, un chacun ét-</p><p lang="fr">ant las de servir de fable à toute la chrétienté et de se voir abandonnés pour enfi-</p><p lang="fr">n rendre les abois. Car pour des promesses, nos ennemis n’en sont pas dépourvus, et off-</p><p lang="fr">rent de montrer lettres de Votre Seigneurie Illustrissime, en cas qu’il se fasse catholique, d’être reçu. Le Saint-Si-</p><p lang="fr">ège lassé de continuer sa dépense, que l’on peut dire avoir été quelque chose durant le</p><p lang="fr">pontificat du pape Grégoire, [m]ais depuis il lui eût mieux été que de tout point on nous eû-</p><p lang="fr">t dénié toute espérance de secours, afin de nous faire prendre une certaine ré-</p><p lang="fr">solution. Et mais que Votre Seigneurie Illustrissime se souvienne avec quelle instance j’ai demandé un de la ma-</p><p lang="fr">ison de Bourbon et le refus qui m’en fut fait, après le mariage de l’Infante avec un de nos pri-</p><p lang="fr">nces, de tout point on m’en fit refus, en remettant à Monsieur le légat et au duc de Feria, où je pen-</p><p lang="fr">se avoir assez fait connaître que jamais n’hasarderion[s] notre religion, honneu-</p><p lang="fr">rs et vies sans être autrement assurés et que Sa Sainteté ne parlât plus clair, car d’autres assu-</p><p lang="fr">rances que d’elle nous n’en voulons point, en étant la plus intéressée, que l’on ne s[e]rai-</p><p lang="fr">t pas pour faire mieux à l’avenir que par le passé, et eusse été bien imprudent de n’user au-</p><p lang="fr">trement, moi qui connais les Espagnols, qui me fit rejeter ce sujet qui me fut</p><p lang="fr">proposé de Sa Sainteté, que à la vérité eût été le meilleur, mais il y fallait voir une lumière</p><p lang="fr">assurée. Aussi ores que mon maître s’y fût voulu laiss[e]r aller, il n’y en a po[i]nt qui lui</p><p lang="fr">eût plus fait de résistance que moi. Et où en serait-il maintena[n]t ? Les ennemi-</p><p lang="fr">s offrant encore de faire voir une lettre de Sa Sainteté adressant à Monsieur le légat, par laquelle il lui ma-</p><p lang="fr">nde de ne rien faire au préjudice de la maiso[n] de Bourbon, contre les lois fondament-</p><p lang="fr">ales du royaume, ni contre les catholiques qui assistent Navarre, chose bien contraire à ta-</p><p lang="fr">nt de protestations que l’on m’a faites. Je l’ai dit et le dirai jusqu’à la mort que s’il en arr-</p><p lang="fr">ive mal, que l’on l’a voulu ai[n]si, car on n’a pas manqué de remontrer tout ce qui se peut, sans</p><p lang="fr">avoir eu autre passion que la religion. Mais entre ces incertitudes on demeure, et si</p><p lang="fr">les autres se servent de l’occasion. Ne font-ils bien ? Encore, pour récompense de toutes no-</p><p lang="fr">s peines, j’en attends un monde de reproches, toutes tombant sur Mayenne qui fait plus qu’il ne de-</p><p lang="fr">vrait sans aucune appréhension, car l’honneur vaut mieux que toutes les apparences</p><p lang="fr">recherchées par la plupart des hommes, joint que la fin couronnera l’œuvre. Car au temps que [ch]-</p><p lang="fr">acun est bandé pour déchirer notre État, qui amènerait après la ruine de la chrétien-</p><p lang="fr">té, abandonné de tout le monde, négligés tous ses avertissements et sur iceux baf-</p><p lang="fr">oué de personnes, hormis leur qualité d’être ministres d’un grand prince, qui ne seraient</p><p lang="fr">pas hors de rang ni de trop bonne maison pour tenir lieu de serviteurs, prend cœur con-</p><p lang="fr">tre toutes sortes de tempêtes pour faire le souverain et seul remède que sa présence, afin</p><p lang="fr">d’empêcher d’une prochaine chute l’État et la religion. Il ne faut point douter qu’il n’y</p><p lang="fr">en ait qui ne veuillent, selon leur coutume, couvrir leurs malices par un monde de fa-</p><p lang="fr">ussetés. Mais si on a su rendre leur dessein vain, il ne manque pas de personnes pour pouv-</p><p lang="fr">oir écrire de bonnes apologies et feront retomber la honte que l’on voudrait jet-</p><p lang="fr">er sur la face de ceux sur lesquels il n’y a que marque d’honneur et de magnanimité. Et plû-</p><p lang="fr">t à Dieu que Sa Sainteté sût comme moi la façon dont ont usé ses ministres, leur intérêt et de ce-</p><p lang="fr">ux qui montrent n’être que religieux, au lieu qu’il n’y a que pure ambition trop découverte, non-</p><p lang="fr">obstant un nombre de protestations au contraire, et où il n’y avait nul moyen de pou-</p><p lang="fr">voir répondre si Monsieur le légat ne s’y fût point entremis, où l’honneur de Sa Sainteté l’a été gran[d]eme-</p><p lang="fr">nt intéressé. Je parle de ses affaires à Votre Seigneurie Illustrissime avec beaucoup de langage ; aussi, si je ne cr-</p><p lang="fr">aignais de l’importuner, il y aurai[t] pour en remplir huit tant de papier. Et pour n’être trop ennuyeux, je lui dirai que</p><p lang="fr">si elle savait, comme moi, l’artifice de nos amis, ce qu’ils ont, font, leur faiblesse, comme</p><p lang="fr">Monsieur le légat s’est montré leur partisa[n] pour déchire[r] notre pauvre État au préjudice de l’hon-</p><p lang="fr">neur du Saint-Siège et un monde d’autres choses, elle s’étonnerait mille et mille fois de la</p><p lang="fr">patience de Mayenne, qui s’est portée jusqu’à vouloir accepter Monsieur Guise pour roi, pourvu que l’on lui</p><p lang="fr">fît voir le moyen de le pouvoir défendre. Mais on veut que l’on croie en paroles, com-</p><p lang="fr">me s’il y avait apparence de plus ajouter foi à des gens qui ne nous firent jamai-</p><p lang="fr">s paraître en avoir et qui ont pour maxime de nous vouloir tromper. Par aventure même</p><p lang="fr">trouverez-vous étrange que je vous ai remarqué les deux points que font courir le-</p><p lang="fr">s ennemis, tant de la lettre de Sa Sainteté que de celle de Votre Seigneurie Illustrissime en particulier, mais il me semble qu’il est bon qu’elle soit</p><p lang="fr">avertie du tout pour y pourvoir. Il est vrai, je l’ai assez protesté de foi[s], que s’il plaît à Sa Sainteté de me faire part de ses</p><p lang="fr">intentions à Mayenne sans y interposer Monsieur le légat, il [n]e prendra pour lui que ses commandements.</p><p lang="fr">Et puis les choses en sont entre eux en tels termes que sans le respect de Sa Sainteté il ne se</p><p lang="fr">jouerait plus si longtemps à ses dépens ni de la ruine de tous ceux de sa mais-</p><p lang="fr">on. Même, il a été si peu respectueux qu’il lui a donné une appréhension de Sa Sainteté, d’ê-</p><p lang="fr">tre en sa mauvaise grâce, que néanmoins un chacun pense être artifice pour parvenir à</p><p lang="fr">ses desseins afin d’obliger l’Espagnol, qui a été toujours sa principale fin.</p><p>Illustrissimo Monseigneur,
Je supplie très humblement le Créateur donner à Votre Seigneurie Illustrissime très heureuse et très longue vie. De Paris ce [22] juillet 1593.
D. V. S. I.
Très humble et très obéissant servit[eur],
Desportes.</p></section></noscript>
