<div id="letter" class="letter" role="tabpanel" aria-labelledby="tab-source"><p class="loading">Loading…</p></div><noscript><section class="plain-letter"><p lang="fr">Notre volonté était bonne, la puissance assez grande pour la faire réussir, mais à sa-</p><p lang="fr">voir si en la continue nous eussions pu subsister. C’est ce qui nous a fait demeurer co-</p><p lang="fr">is. Et en ces entrefaites nos amis ne se sont pas seulement montrés neutres, mais enne-</p><p lang="fr">mis formels et fait ce qu’ils ont pu pour tendre à la ruine de l’ami de l’homme du collège et le vôtre.</p><p lang="fr">Sans y avoir rien épargné, opposant tantôt un sujet, tantôt un autre, secon-</p><p lang="fr">dé par notre docteur Gratian, qui a mieux joué le personnage que nul des autres, jusqu’-</p><p lang="fr">à y coucher de l’autorité de son maître, voire l’avoir mis en compromis et fait beaucoup</p><p lang="fr">de préjudice. Si notre oncle eût voulu parler suivant la promesse qu’il en avait</p><p lang="fr">faite à celui qui l’alla trouver, et que l’homme de La Chesne eût donné d’autres assuran-</p><p lang="fr">ces que des paroles, la tête baissée on y eût entré. Mais croyez qu’il n’y a peu à penser.</p><p lang="fr">Celui qui est loin en parle comme un aveugle des couleurs. Tout ce qui se pouvait de mieux était la</p><p lang="fr">protection et gagner le temps. Il ne s’est pas fait. Il fallait la trêve. L’impruden-</p><p lang="fr">ce du monarque et des siens ay[a]nt été telle qu’il n’avait fait nul préparatif, ou du moi[n]s si</p><p lang="fr">petite que le moindre gentilhomme en une querelle particulière en eût fait davantage. Et pour votr-</p><p lang="fr">e côté, ç’a été un autre bel acte que le licenciement que fit votre auditeur. Je veux</p><p lang="fr">croire ce que vous m’écrivez, qu’il n’y a nul changement. Toutefois c’est un fait étrange</p><p lang="fr">que notre Poquinteste ne nous ait rien emporté de particulier, que l’on nous ait dit ce que l’on a</p><p lang="fr">voulu, et ce n’a été que des paroles les plus extrava[g]antes, que quand j’eusse pensé perdre tout, vo-</p><p lang="fr">ire été privé de paradis, j’eusse passé bien plus ava[n]t. Se travailler, se ruiner, faire</p><p lang="fr">c[e qui] se peut, tant que sans notre prudence on ne durerait pas une heure, et pour récompen-</p><p lang="fr">se bâtir une ruine. Or je ne serais pas si charitable, je le confesse. Si notre ami</p><p lang="fr">du collège en voulait parler à l’homme de La Chesne, il obligerait infiniment notre</p><p lang="fr">ami qui est tout sien. Et quant à ce qui regarde votre pension, cela ne se peut, car nul ne</p><p lang="fr">y assiste que le prélat à qui la pièce est affectée, et il n’est pas temps de lui rien lever. Ç’a é-</p><p lang="fr">té votre malheur et le mien. Courage, il se présentera d’autres occasions. Je tiens</p><p lang="fr">que l’on aura la trêve dans peu de jours. Le voyage de [Gondi] a été le plus pernicieux</p><p lang="fr">que chose du monde. Il a fait changer de religion au Navarre et ôter cinq cent mille écus. Leur</p><p lang="fr">parti était ruiné sans ce changement. Notre ⟦r/e⟧ légat a fait ce qu’il a pu pour cou-</p><p lang="fr">vrir l’Espagnol. Il a embrassé leur affaire avec tant de / ardeur / qu’il a négli-</p><p lang="fr">gé ce qui était du service de son maître, jusqu’à n’avoir fait tenir un seul de nos</p><p lang="fr">brefs qui eussent infiniment profité. Mais ce n’était pas ce qu’il dés[ir]ait, au †</p><p lang="fr">contraire de hâter le démembrement de notre État. Par la lettre de Sa Sainteté vous</p><p lang="fr">saurez au vrai l’état général de nos affaires. Je vous baise les mains et prie Dieu vous</p><p>donne prospérité et longue vie. De Paris ce [22] juillet 1593.
Votre humble serviteur.
[Paraphe sans expansion alphabétique.]</p></section></noscript>
