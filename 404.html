<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — prinz</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .not-found { max-width: 700px; min-height: 65vh; padding: 10vh 0; }
      .not-found h1 { font: 900 clamp(64px, 12vw, 120px)/1 Arial, Helvetica, sans-serif; letter-spacing: -.08em; margin: 0 0 22px; }
      .not-found p { color: #263754; font-size: clamp(22px, 3vw, 30px); line-height: 1.3; }
      .not-found a { color: #b4371c; border-bottom: 1px solid currentColor; }
    </style>
    <script>
      (() => {
        const path = window.location.pathname;
        const legacyPath = /^\/(?:p\/|t\/)/i.test(path) || /^\/(?:about|archive|subscribe)\/?$/i.test(path);
        if (legacyPath) {
          window.location.replace(`https://www.prinzai.com${path}${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__brand" href="/">prinz</a>
      <nav class="site-nav" aria-label="Main navigation"><a href="/">Home</a><a href="https://www.prinzai.com/">Blog ↗</a></nav>
    </header>
    <main class="not-found">
      <h1>Lost signal.</h1>
      <p>This page could not be found. <a href="/">Return to the homepage</a> or <a href="https://www.prinzai.com/">visit the blog</a>.</p>
    </main>
  </body>
</html>
